name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - diag/sampler-lod-bias-runner

permissions:
  contents: read

jobs:
  go:
    name: Build, vet and test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compare native Metal LOD controls
        run: |
          sw_vers
          xcodebuild -version
          clang++ -std=c++17 -fobjc-arc -O2 -Wl,-dead_strip \
            -Ipkg/runtime/modules/libSceGnmDriver -Ipkg/runtime/core \
            tests/gnm_metal_test/sampler_lod_bias.mm \
            pkg/runtime/modules/libSceGnmDriver/ps4_gnm_resources.mm \
            -framework Metal -framework Foundation -o "$RUNNER_TEMP/lod-probe"
          "$RUNNER_TEMP/lod-probe"
